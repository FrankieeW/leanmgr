[package]
name = "leanmgr"
version = "0.2.0"
edition = "2024"
description = "Manage disposable .lake cache state across many Lean 4 projects"
license = "MIT"

[[bin]]
name = "lm"
path = "src/bin/lm.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
crossterm = "0.29.0"
indicatif = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
walkdir = "2"
